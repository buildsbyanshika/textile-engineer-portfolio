name: Publish Docker Image to Docker Hub

on:
  push:
    branches: [ "master", "main" , "new-ci-workflow",]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub (Not GHCR)
      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata specifically for Docker Hub
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/textile-engineer-portfolio
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push from the my-app folder
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./my-app
          file: ./my-app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_GOOGLE_FORM_URL=${{ secrets.REACT_APP_GOOGLE_FORM_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
